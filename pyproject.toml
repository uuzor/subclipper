[project]
name = "quickreel"
version = "0.1.0"
description = "AI viral clip generator: ingest long-form video, detect engaging moments, render platform-ready vertical clips."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
ai = [
    "faster-whisper>=1.1",
    # PyAV 16+ changed the container open() signature that faster-whisper
    # 1.2.x calls, so keep it pinned below 16 until upstream catches up.
    "av<16",
    "google-generativeai>=0.8",
    "librosa>=0.10",
    "numpy>=1.26",
]
# Hosted vision/reasoning only. The ``ai`` extra also pulls faster-whisper,
# which needs ctranslate2 and (via librosa) scipy, llvmlite and numba - about
# 1.1GB. That does not fit a small hosting instance, and a deployment using
# hosted speech and vision does not need it.
hosted-ai = [
    "google-generativeai>=0.8",
    "httpx>=0.27",
]
download = [
    "yt-dlp>=2025.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickreel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/File() in argument defaults is the documented idiom.
ignore = ["B008"]
